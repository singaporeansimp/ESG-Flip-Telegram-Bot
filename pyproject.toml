[project]
name = "esgbot"
version = "0.1.0"
description = "Telegram bot that runs ESG poker flips in a group chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    # Test-only: an independent evaluator the hand-ranking tests cross-check against.
    "treys>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esgbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",   # bugbear
    "C4",  # comprehensions
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PT",  # pytest style
    "RUF", # ruff-specific
    "SIM", # simplify
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Test vectors and fixtures read better with the single-letter game settings.
"tests/*" = ["N803", "N806"]

[tool.mypy]
python_version = "3.12"
files = ["esgbot", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# treys is a test-only cross-check library and ships no type information.
module = ["treys.*"]
ignore_missing_imports = true
